apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mi-adf-shir-deployment
  namespace: mi
spec:
  releaseName: mi-adf-shir
  values:
    additionalEnv:
      # CVE-2026-114938 (Java4Shell) mitigation - RMI-4154 (SHIR loads the JVM via JNI, so JAVA_TOOL_OPTIONS; heap kept from image default)
      JAVA_TOOL_OPTIONS: "-Xms1024m -Xmx2048m -XX:-UseBASE64Intrinsics"
    image: hmctsprod.azurecr.io/mi/adf-integration-runtime:prod-c981061-20260717204743 #{"$imagepolicy": "flux-system:mi-adf-shir"}
    replicaCount: 2
    memoryLimits: '4096Mi'
    environment: "test"
    resourceGroup: "mi-test-rg"
    subscriptionId: "3eec5bde-7feb-4566-bfb6-805df6e10b90"
    tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
    managedIdentityClientId: "4b4479ac-2998-4353-b202-675df08389f5"
    hostAliases:
    - ip: 20.209.128.129
      hostnames:
      - mcmshmctssitdataextract.blob.core.windows.net
