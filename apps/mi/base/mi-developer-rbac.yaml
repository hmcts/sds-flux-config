kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: mi
  name: mi-developer
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/portforward", "pods/log", "services", "configmaps", "secrets", "serviceaccounts"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["delete", "get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["delete", "get", "list", "watch"]
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: ["helmreleases"]
  verbs: ["delete", "get", "list", "watch"]
- apiGroups: ["keda.sh"]
  resources: ["scaledjobs", "scaledobjects", "triggerauthentications"]
  verbs: ["delete", "get", "list", "patch", "update", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mi-developer
  namespace: mi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mi-developer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: "686c38d0-706c-4851-b40d-b3fa18f2a8af"
