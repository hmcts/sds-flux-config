kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ben-edwards-cronjob-role
rules:
- apiGroups: ['batch']
  resources: ['cronjobs', 'jobs']
  verbs: ['create', 'get', 'list', 'patch', 'update', 'watch']
- apiGroups: ['']
  resources: ['pods']
  verbs: ['get', 'list', 'watch']
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ben-edwards-cronjob-role
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ben-edwards-cronjob-role
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: Ben.Edwards@HMCTS.NET
