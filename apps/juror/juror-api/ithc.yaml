  namespace: juror
spec:
  releaseName: juror-api
  values:
    java:
      # Uncomment and edit the line below to fix the environment at a specific image
      image: hmctsprod.azurecr.io/juror/api:pr-1207-c9c2f3f-20260826121712 # {"$imagepolicy": "flux-system:juror-api-pr"}
      ingressHost: juror-api.ithc.platform.hmcts.net
      environment:
        RUN_DB_MIGRATION_ON_STARTUP: true
        RESTART_ME: 1
        DIGITAL_BY_DEFAULT: true
