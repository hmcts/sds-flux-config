apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: juror-public
  namespace: juror
spec:
  releaseName: juror-public
  values:
    nodejs:
      # Uncomment and edit the line below to fix the environment at a specific image
      image: hmctsprod.azurecr.io/juror/public:pr-441-d3f6b8e-20260806115317 # {"$imagepolicy": "flux-system:juror-public-test"}
      ingressHost: juror-public.test.apps.hmcts.net
      keyVaults:
        juror:
          secrets:
            - name: public-sessionsecret
              alias: public-sessionsecret
            - name: public-jwtKey
              alias: public-jwtKey
            - name: public-jwtNoAuthKey
              alias: public-jwtNoAuthKey
            - name: public-jwtKeyBureau
              alias: public-jwtKeyBureau
            - name: public-jwtTTL
              alias: public-jwtTTL
            - name: public-pcqTokenKey
              alias: public-pcqTokenKey
            - name: public-managedRedisConnection
              alias: public-redisConnection
            - name: public-dynatraceScriptUrl
              alias: public-dynatraceScriptUrl
            - name: app-insights-connection-string
              alias: app-insights-connection-string
      environment:
        DUMMY_ENV_VAR: 1
        LOG_SANITISATION_DISABLED: true
