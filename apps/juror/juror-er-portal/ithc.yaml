apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: juror-er-portal
  namespace: juror
spec:
  releaseName: juror-er-portal
  values:
    nodejs:
      # Uncomment and edit the line below to fix the environment at a specific image
      image: hmctsprod.azurecr.io/juror/er-portal:pr-288-42d2fa9-20261126121857 # {"$imagepolicy": "flux-system:juror-er-portal-ithc"}
      ingressHost: juror-er.ithc.apps.hmcts.net
      environment:
        API_ENDPOINT: https://juror-api.ithc.platform.hmcts.net/api/v1
        REDIRECT_URI: https://juror-er.ithc.apps.hmcts.net/auth/redirect
        POST_LOGOUT_REDIRECT_URI: https://juror-er.ithc.apps.hmcts.net
        SKIP_SSO: true
