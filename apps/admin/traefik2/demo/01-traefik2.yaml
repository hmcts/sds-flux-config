apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik2
  namespace: admin
spec:
  chart:
    spec:
      version: 42.0.0
  values:
    image:
      tag: v3.7.15
    logs:
      $patch: delete
    accessLog:
      enabled: true
    ports:
      traefik:
        expose:
          default: false
          internal: true
    service:
      spec:
        loadBalancerIP: "10.51.95.250"
      additionalServices:
        internal:
          spec:
            type: ClusterIP
          labels:
            traefik-service-label: internal
    deployment:
      podLabels:
        useWorkloadIdentity: "true"
    serviceAccount:
      name: admin
