apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-zrs-tagged
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_ZRS
  tags: managedBy=DTS Platform Operations,businessArea=Cross-Cutting,builtFrom=https://github.com/hmcts/sds-flux-config,environment=dev
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
