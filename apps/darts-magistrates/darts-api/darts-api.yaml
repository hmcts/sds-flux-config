apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: darts-magistrates-api
  namespace: darts-magistrates
spec:
  releaseName: darts-magistrates-api
  chart:
    spec:
      chart: ./stable/darts-api
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
  values:
    java:
      replicas: 2
      image: hmctsprod.azurecr.io/darts/api:prod-998c7f3-20261111134856 # {"$imagepolicy": "flux-system:darts-magistrates-api"}
      disableTraefikTls: true
      memoryRequests: '3G'
      memoryLimits: '4G'
      cpuRequests: '2000m'
      cpuLimits: '3000m'
      environment:
        RUN_DB_MIGRATION_ON_STARTUP: true
        DARTS_PORTAL_URL: https://darts-magistrates.{{ .Values.global.environment }}.apps.hmcts.net
    function:
      job:
        activeDeadlineSeconds: 7200
      image: hmctsprod.azurecr.io/darts/api:prod-998c7f3-20261111134856 # {"$imagepolicy": "flux-system:darts-magistrates-api"}
      memoryRequests: 500Mi
      cpuRequests: 500m
      memoryLimits: 4Gi
      cpuLimits: 4
      environment:
        DARTS_GATEWAY_URL: http://darts-magistrates-gateway.{{ .Values.global.environment }}.platform.hmcts.net
    darts-portal:
      enabled: false
      ingressHost: darts-magistrates-portal-nodejs.{{ .Values.global.environment }}.apps.hmcts.net
      replicas: 0
      autoscaling:
        enabled: false
