apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../rbac/nonprod-role.yaml
  - darts-api-function.enc.yaml
  - ../../../base/slack-provider/test
namespace: darts-magistrates
patches:
  - path: ../../darts-api/test.yaml
  - path: ../../darts-automated-tasks/test.yaml
  - path: ../../darts-external-component-test-harness/test.yaml
  - path: ../../darts-portal/test.yaml
  - path: ../../darts-gateway/test.yaml
  - path: ../../identity/test.yaml
  - path: ../../serviceaccount/test.yaml
  - path: ../../static-auth/api-keyvaults.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: darts-magistrates-(api|automated-tasks)
  - path: ../../static-auth/gateway-keyvaults.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: darts-magistrates-gateway
