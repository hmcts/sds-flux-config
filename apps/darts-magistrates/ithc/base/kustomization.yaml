apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../rbac/nonprod-role.yaml
  - ./darts-api-function.enc.yaml
  - ../../../base/slack-provider/ithc
namespace: darts-magistrates
patches:
  - path: ../../darts-api/ithc.yaml
  - path: ../../darts-automated-tasks/ithc.yaml
  - path: ../../darts-external-component-test-harness/ithc.yaml
  - path: ../../darts-portal/ithc.yaml
  - path: ../../darts-gateway/ithc.yaml
  - path: ../../identity/ithc.yaml
  - path: ../../serviceaccount/ithc.yaml
  - path: ../../static-auth/api-keyvaults.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: darts-magistrates-(api|automated-tasks)
  - path: ../../static-auth/gateway-keyvaults.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: darts-magistrates-gateway
