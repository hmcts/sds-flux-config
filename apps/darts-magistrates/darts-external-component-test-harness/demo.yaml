apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: darts-magistrates-external-component-test-harness
  namespace: darts-magistrates
spec:
  releaseName: darts-magistrates-external-component-test-harness
  values:
    java:
      ingressHost: darts-magistrates-external-component-test-harness.demo.platform.hmcts.net
      replicas: 1
      environment:
        DARTS_LOG_LEVEL: DEBUG
        TEST_HARNESS_AUTOMATION_ENABLED: false
        TEST_HARNESS_PROXY_URL: http://darts-magistrates-gateway.demo.platform.hmcts.net/service
