apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: darts-magistrates-gateway
  namespace: darts-magistrates
spec:
  releaseName: darts-magistrates-gateway
  values:
    java:
      ingressHost: darts-magistrates-gateway.test.platform.hmcts.net
      environment:
        DARTS_LOG_LEVEL: INFO
        DARTS_SOAP_REQUEST_LOG_LEVEL: TRACE
        DAR_NOTIFY_ENABLED: false
        ACTIVE_DIRECTORY_B2C_BASE_URI: https://hmctsstgextid.b2clogin.com
        ACTIVE_DIRECTORY_B2C_AUTH_URI: https://hmctsstgextid.b2clogin.com/hmctsstgextid.onmicrosoft.com
        ACTIVE_DIRECTORY_B2C_ON_MICROSOFT_URI: https://hmctsstgextid.onmicrosoft.com
        APPLICATIONINSIGHTS_INSTRUMENTATION_LOGGING_LEVEL: ALL
        TESTING_SUPPORT_ENDPOINTS_ENABLED: true
