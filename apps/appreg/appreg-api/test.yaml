apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: appreg-api
  namespace: appreg
spec:
  # Freeze Helm deployments during performance testing; existing pods remain running.
  suspend: true
  releaseName: appreg-api
  values:
    java:
      # Keep capacity fixed during performance testing.
      autoscaling:
        enabled: false
      replicas: 4
      ingressHost: appreg-api.test.platform.hmcts.net
      image: hmctsprod.azurecr.io/appreg/api:prod-32e8f94-20261029131533 # {"$imagepolicy": "flux-system:appreg-api"}
      environment:
        ENV_NAME: "PERFTEST"
        RESTART_ME: "006"
        AZURE_ISSUER: "https://login.microsoftonline.com/e575f663-b30a-4786-89ad-319842dfe853/v2.0"
      keyVaults:
        appreg:
          disabled: true
        appreg-kv:
          mountPath: /mnt/secrets/appreg
          secrets:
            - name: AppInsightsInstrumentationKey
              alias: APP_INSIGHTS_INSTRUMENTATION_KEY
            - name: app-insights-connection-string
              alias: app-insights-connection-string
            - name: POSTGRES-USER
              alias: POSTGRES_USER
            - name: POSTGRES-PASS
              alias: POSTGRES_PASS
            - name: POSTGRES-HOST
              alias: POSTGRES_HOST
            - name: POSTGRES-PORT
              alias: POSTGRES_PORT
            - name: POSTGRES-DATABASE
              alias: POSTGRES_DATABASE
            - name: azure-tenant-id
              alias: AZURE_TENANT_ID
            - name: azure-client-secret
              alias: azure-client-secret
            - name: azure-app-id
              alias: AZURE_AUDIENCE_ID
            - name: CSDS-KEY-1
              alias: CSDS_KEY_1
            - name: CSDS-KEY-2
              alias: CSDS_KEY_2
