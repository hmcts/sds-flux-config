apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: appreg-api
  namespace: appreg
spec:
  # Freeze Helm deployments during UAT; existing pods remain running.
  suspend: true
  releaseName: appreg-api
  values:
    java:
      ingressHost: appreg-api.demo.platform.hmcts.net
      image: hmctsprod.azurecr.io/appreg/api:prod-341cf3a-20261112110751 # {"$imagepolicy": "flux-system:appreg-api"}
      environment:
        ENV_NAME: "DEMO"
        RESTART_ME: "001"
        LOG_LEVEL: "DEBUG"
