apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: appreg-frontend
  namespace: appreg
spec:
  releaseName: appreg-frontend
  values:
    nodejs:
      ingressHost: appreg.apps.hmcts.net
      image: hmctsprod.azurecr.io/appreg/frontend:prod-8e027be-20261002140444 # {"$imagepolicy": "flux-system:appreg-frontend"}
      environment:
        ENV_NAME: "PRODUCTION"
        LOG_LEVEL: "INFO"
        APPREG_API_BASE_URL: https://appreg-api.platform.hmcts.net
      keyVaults:
        appreg:
          secrets:
            - name: app-insights-connection-string
              alias: app-insights-connection-string-fe
            - name: azure-tenant-id
              alias: azure-tenant-id-fe
            - name: azure-client-secret
              alias: azure-client-secret-fe
            - name: azure-app-id
              alias: azure-app-id-fe
            - name: managed-redis-connection-string
              alias: redis-connection-string
