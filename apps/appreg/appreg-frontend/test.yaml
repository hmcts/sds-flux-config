apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: appreg-frontend
  namespace: appreg
spec:
  # Freeze Helm deployments during performance testing; existing pods remain running.
  suspend: true
  releaseName: appreg-frontend
  values:
    nodejs:
      # Keep capacity fixed during performance testing.
      autoscaling:
        enabled: false
      replicas: 4
      ingressHost: appreg.test.apps.hmcts.net
      image: hmctsprod.azurecr.io/appreg/frontend:prod-f66f77d-20261029142630 # {"$imagepolicy": "flux-system:appreg-frontend"}
      environment:
        ENV_NAME: "PERFTEST"
        RESTART_ME: "009"
      keyVaults:
        appreg:
          disabled: true
        appreg-kv:
          mountPath: /mnt/secrets/appreg
          secrets:
            - name: app-insights-connection-string
              alias: app-insights-connection-string-fe
            - name: azure-tenant-id
              alias: azure-tenant-id-fe
            - name: azure-client-secret
              alias: azure-client-secret-fe
            - name: azure-app-id
              alias: azure-app-id-fe
            - name: managed-redis-connection-string
              alias: redis-connection-string
            - name: test-user1-email
              alias: TEST-USER1-EMAIL
            - name: test-user2-email
              alias: TEST-USER2-EMAIL
            - name: test-user3-email
              alias: TEST-USER3-EMAIL
            - name: test-admin1-email
              alias: TEST-ADMIN1-EMAIL
            - name: test-admin2-email
              alias: TEST-ADMIN2-EMAIL
            - name: test-admin3-email
              alias: TEST-ADMIN3-EMAIL
            - name: test-users-password
              alias: TEST-USERS-PASSWORD
