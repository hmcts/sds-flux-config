apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: appreg-frontend
  namespace: appreg
spec:
  # Freeze Helm deployments during UAT; existing pods remain running.
  suspend: true
  releaseName: appreg-frontend
  values:
    nodejs:
      ingressHost: appreg.demo.apps.hmcts.net
      image: hmctsprod.azurecr.io/appreg/frontend:prod-5fee31d-20261112013310 # {"$imagepolicy": "flux-system:appreg-frontend"}
      environment:
        ENV_NAME: "DEMO"
        RESTART_ME: "001"
        LOG_LEVEL: "DEBUG"
