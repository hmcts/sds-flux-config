apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pre-api-cron-update-recordings-visibility
  namespace: pre
spec:
  values:
    global:
      jobKind: CronJob
    job:
      suspend: true
      schedule: "50 15 * * Thu" # 4:50 BST, Thursday
      image: hmctsprod.azurecr.io/pre/api:prod-389cd73-20260722110012 # {"$imagepolicy": "flux-system:pre-api"}
      environment:
        PLATFORM_ENV_TAG: Demo
