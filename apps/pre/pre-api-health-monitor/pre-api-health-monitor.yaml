apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pre-api-health-monitor
  namespace: pre
spec:
  interval: 10m
  releaseName: pre-api-health-monitor
  values:
    java:
      enabled: true
      replicas: 1
      image: hmctsprod.azurecr.io/pre/api:prod-f5b35fd-20261105112328 # {"$imagepolicy": "flux-system:pre-api"}
      memoryRequests: '2Gi'
      memoryLimits: '2Gi'
      autoscaling:
        enabled: false
      ingressHost: ''
  chart:
    spec:
      chart: ./stable/pre-api
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 5m
  install:
    disableWait: true
  upgrade:
    disableWait: true
