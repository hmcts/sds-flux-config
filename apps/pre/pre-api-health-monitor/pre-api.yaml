apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pre-api-health-monitor
  namespace: pre
spec:
  interval: 10m
  releaseName: pre-api-health-monitor
  values:
    java:
      enabled: true
      replicas: 1
      image: hmctsprod.azurecr.io/pre/api:prod-0bcc2d3-20261006140325 # {"$imagepolicy": "flux-system:pre-api"}
      disableTraefikTls: true
      memoryRequests: '1Gi'
      memoryLimits: '1Gi'
      autoscaling:
        enabled: false
      ingress:
        enabled: false
  chart:
    spec:
      chart: ./stable/pre-api
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 5m
  install:
    disableWait: true
  upgrade:
    disableWait: true
