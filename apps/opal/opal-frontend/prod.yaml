apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opal-frontend
  namespace: opal
spec:
  releaseName: opal-frontend
  values:
    nodejs:
      ingressHost: opal-frontend.apps.hmcts.net
      keyVaults:
        opal:
          secrets:
            - app-insights-connection-string
            - managed-redis-connection-string
            - opal-frontend-session-secret
            - opal-frontend-cookie-secret
            - opal-frontend-csrf-secret
            - launch-darkly-client-id
            - AzureADClientId
            - AzureADClientSecret
            - AzureADTenantId
      environment:
        DUMMY_VAR: 1
        FRONTEND_HOSTNAME: https://opal-frontend.apps.hmcts.net
        OPAL_API_URL: https://opal-fines-service.platform.hmcts.net
        OPAL_FINES_SERVICE_API_URL: https://opal-fines-service.platform.hmcts.net
        OPAL_USER_SERVICE_API_URL: https://opal-user-service.platform.hmcts.net
        FEATURES_IP_LOGGING_ENABLED: true