apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opal-user-service
  namespace: opal
spec:
  releaseName: opal-user-service
  chart:
    spec:
      chart: ./stable/opal-user-service
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
  values:
    java:
      image: hmctsprod.azurecr.io/opal/user-service:prod-6c43ce0-20261019143118 # {"$imagepolicy": "flux-system:opal-user-service"}
      disableTraefikTls: true
    user-role-mapping-refresh:
      image: hmctsprod.azurecr.io/opal/user-service:prod-6c43ce0-20261019143118 # {"$imagepolicy": "flux-system:opal-user-service"}
