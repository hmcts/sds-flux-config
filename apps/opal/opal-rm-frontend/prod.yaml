apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opal-rm-frontend
  namespace: opal
spec:
  releaseName: opal-rm-frontend
  values:
    nodejs:
      ingressHost: opal-rm-frontend.apps.hmcts.net
      environment:
        FRONTEND_HOSTNAME: https://opal-rm-frontend.apps.hmcts.net
        OPAL_API_URL: https://opal-fines-service.platform.hmcts.net
        OPAL_FINES_SERVICE_API_URL: https://opal-fines-service.platform.hmcts.net
        OPAL_RM_SERVICE_API_URL: https://opal-rm-service.platform.hmcts.net
        OPAL_USER_SERVICE_API_URL: https://opal-user-service.platform.hmcts.net
        ALLOW_CONFIG_MUTATIONS: false
        FEATURES_IP_LOGGING_ENABLED: true
