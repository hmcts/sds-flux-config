apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opal-file-handler-service
  namespace: opal
spec:
  releaseName: opal-file-handler-service
  values:
    java:
      ingressHost: opal-file-handler-service.platform.hmcts.net
      environment:
