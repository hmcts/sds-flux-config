apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opal-file-handler-service
  namespace: opal
spec:
  releaseName: opal-file-handler-service
  values:
    java:
      ingressHost: opal-file-handler-service.staging.platform.hmcts.net
      environment:
        DUMMY_VAR: 0
        OPAL_FRONTEND_URL: https://opal-frontend.staging.apps.hmcts.net
        OPAL_USER_SERVICE_API_URL: https://opal-user-service.staging.platform.hmcts.net
        TESTING_SUPPORT_ENDPOINTS_ENABLED: true
        LAUNCH_DARKLY_ENV: stg
        FLYWAY_LOCATIONS: classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/stg
    bt-eckoh-report:
      environment:
        OPAL_FRONTEND_URL: https://opal-frontend.staging.apps.hmcts.net
        TESTING_SUPPORT_ENDPOINTS_ENABLED: false
        LAUNCH_DARKLY_ENV: stg
