apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: courtfines-app
  namespace: courtfines
spec:
  releaseName: courtfines-app
  values:
    nodejs:
      ingressHost: courtfines.justice.gov.uk
      image: hmctsprod.azurecr.io/courtfines/app:prod-459e4ba-20261028150836 # {"$imagepolicy": "flux-system:courtfines-app"}
      environment:
        ENV_NAME: "PRODUCTION"
        LOG_LEVEL: "INFO"
        MAINTENANCE_BANNER_ENABLED: "false"
        MAINTENANCE_BANNER_MESSAGE: "The HMCTS Online payments service will be unavailable on Thursday 29 October from 10am to 2pm for an essential upgrade."
        PAYMENTS_PAUSED: "false"
