apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: courtfines-app
  namespace: courtfines
spec:
  releaseName: courtfines-app
  values:
    nodejs:
      ingressHost: courtfines.justice.gov.uk
      image: hmctsprod.azurecr.io/courtfines/app:prod-1f08825-20260814105414 # {"$imagepolicy": "flux-system:courtfines-app"}
      environment:
        ENV_NAME: "PRODUCTION"
        LOG_LEVEL: "INFO"
        MAINTENANCE_BANNER_ENABLED: "false"
        MAINTENANCE_BANNER_MESSAGE: "The HMCTS Online payments service will be unavailable from 10pm on Friday 7 August to 9am on Saturday 8 August for an essential upgrade."
        PAYMENTS_PAUSED: "false"
