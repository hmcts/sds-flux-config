apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: courtfines-app
  namespace: courtfines
spec:
  releaseName: courtfines-app
  values:
    nodejs:
      ingressHost: courtfines.justice.gov.uk
      image: hmctsprod.azurecr.io/courtfines/app:prod-9422014-20261007131907 # {"$imagepolicy": "flux-system:courtfines-app"}
      environment:
        ENV_NAME: "PRODUCTION"
        LOG_LEVEL: "INFO"
        MAINTENANCE_BANNER_ENABLED: "false"
        MAINTENANCE_BANNER_MESSAGE: "The HMCTS Online payments service will be unavailable on Tuesday 6 October from 10am to 3pm for an essential upgrade."
        PAYMENTS_PAUSED: "false"
