---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toffee-recipe-backend
spec:
  interval: 5 min
  releaseName: toffee-recipe-backend
  values:
    java:
      memoryRequests: "1Gi"
      image: hmctsprod.azurecr.io/toffee/recipe-backend:prod-991e7bf-20260924061619 # {"$imagepolicy": "flux-system:toffee-recipe-backend"}
      disableTraefikTls: true
  chart:
    spec:
      chart: ./stable/toffee-recipe-backend
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
