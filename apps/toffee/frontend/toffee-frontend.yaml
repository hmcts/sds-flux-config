apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toffee-frontend
spec:
  interval: 5m
  releaseName: toffee-frontend
  chart:
    spec:
      chart: ./stable/toffee-frontend
      sourceRef:
        kind: GitRepository
        name: hmcts-charts
        namespace: flux-system
      interval: 1m
  values:
    nodejs:
      memoryRequests: "512Mi"
      image: hmctsprod.azurecr.io/toffee/frontend:prod-6c5c7d7-20261023102037 #{"$imagepolicy": "flux-system:toffee-frontend"}
      disableTraefikTls: true
