apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: met-themis-chart-migration
  namespace: met
spec:
  interval: 5m
  releaseName: met-themis-chart-migration
  chart:
    spec:
      chart: ./
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: met-themis-chart-migration
        namespace: flux-system
      interval: 1m
  test:
    enable: false
  values:
    java:
      useWorkloadIdentity: true
      saEnabled: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - met-themis-chart-migration-nodejs
              topologyKey: kubernetes.io/hostname
      livenessDelay: 180
      startupDelay: 90
      startupPeriodSeconds: 10
      startupFailureThreshold: 60
      startupTimeoutSeconds: 5
      image: hmctsprod.azurecr.io/imported/busybox@sha256:0415f56ccc05526f2af5a7ae8654baec97d4a614f24736e8eef41a4591f08019
      ingressHost: null
      replicas: 1
      autoscaling:
        enabled: false
      cpuRequests: 25m
      cpuLimits: 100m
      memoryRequests: 64Mi
      memoryLimits: 128Mi
      environment:
        KV_CONFIG_TREE: /mnt/secrets/libragob-test-kv/
        LOG4J_DEBUG: true
        LOGGING_LEVEL_ROOT: DEBUG
        LOGGING_LEVEL_ORG_HIBERNATE: WARN
        LOGGING_LEVEL_ORG_POSTGRESQL: WARN
        LOGGING_LEVEL_COM_ZAXXER_HIKARI: WARN
        THEMIS_GATEWAY_MESSAGEAUDITSUPPRESSION: ON
        MESSAGE_AUDIT_SUPPRESSION: ON
        TEMP_VAR: 0
        DAC_NUMBER_OF_INSTANCES: 3
      keyVaults:
        libragob-test-kv:
          excludeEnvironmentSuffix: true
          secrets:
            - themis-gateway-keystorebase64
            - themis-gateway-dbpassword
            - themis-gateway-dbusername
            - themis-gateway-datasourceurl
            - dac-datasource-password
            - dac-datasource-username
            - dac-datasource-url
            - event-datasource-password
            - event-datasource-username
            - event-datasource-url
            - fines-datasource-password
            - fines-datasource-username
            - fines-datasource-url
            - maintenance-datasource-password
            - maintenance-datasource-username
            - maintenance-datasource-url
            - confiscation-datasource-password
            - confiscation-datasource-username
            - confiscation-datasource-url
            - servicebus-connectionstring
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: met-themis-chart-migration-nodejs
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: met-themis-chart-migration-nodejs
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    containers:
                      - name: met-themis-chart-migration-nodejs
                        command:
                          - /bin/sh
                          - -c
                        args:
                          - while true; do sleep 3600; done
                        startupProbe: null
                        livenessProbe: null
                        readinessProbe: null
