---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenkins
  namespace: jenkins
spec:
  values:
    controller:
      prometheus:
        enabled: true
        serviceMonitorAdditionalLabels:
          release: kube-prometheus-stack
      JCasC:
        configScripts:
          prometheus: |
            unclassified:
              prometheusConfiguration:
                path: "prometheus"
                defaultNamespace: "default"
                useAuthenticatedEndpoint: false
                collectingMetricsPeriodInSeconds: 120
                collectNodeStatus: true
                # Full per-build history remains in the CosmosDB ->
                # dtsse-dashboard-ingestion -> Postgres pipeline. Here we expose
                # the plugin's per-job metrics for runtime, per-stage duration,
                # pass/fail counts and disk usage, plus a bounded window of
                # per-run history (perBuildMetrics + max-builds/max-age caps
                # below) for recent-build trend visibility in Grafana.
                collectDiskUsage: true
                countSuccessfulBuilds: true
                countUnstableBuilds: true
                countFailedBuilds: true
                countNotBuiltBuilds: false
                countAbortedBuilds: true
                fetchTestResults: false
                # Adds the `number` (build number) label to build_*/stage_*
                # metrics. Bounded to the last 10 builds per job AND max 72h
                # old (the stricter limit wins) to keep series cardinality sane.
                perBuildMetrics: true
                perBuildMetricsMaxBuilds: 10
                perBuildMetricsMaxAgeInHours: 72
                appendParamLabel: false
                appendStatusLabel: false
                processingDisabledBuilds: false
                # Must be declared EXPLICITLY EMPTY: JCasC does not reset
                # attributes that are simply removed from the YAML, and the
                # previous trim regex (default_jenkins_builds_.*) is persisted
                # in the controller's config XML — without this block it stays
                # active and keeps suppressing all builds_* metrics.
                disabledMetricConfig:
                  entries: []
