---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenkins
  namespace: jenkins
spec:
  values:
    controller:
      prometheus:
        enabled: true
        serviceMonitorAdditionalLabels:
          release: kube-prometheus-stack
      JCasC:
        configScripts:
          prometheus: |
            unclassified:
              prometheusConfiguration:
                path: "prometheus"
                defaultNamespace: "default"
                useAuthenticatedEndpoint: false
                collectingMetricsPeriodInSeconds: 120
                collectNodeStatus: true
                # SANDBOX DISCOVERY MODE (DTSPO-34168/34169): all build metric
                # families are exposed so the team can browse what is available
                # in Prometheus and pick a keep-list. Re-introduce a
                # disabledMetricConfig trim before enabling any of this on prod
                # — series cost scrape/storage whether queried or not.
                # Full unbounded per-build history remains in the CosmosDB ->
                # dtsse-dashboard-ingestion -> Postgres pipeline.
                #
                # collectDiskUsage stays false: the plugin docs warn against
                # walking disk usage on cloud storage; PVC usage already comes
                # from kubelet metrics.
                collectDiskUsage: false
                # The count* flags gate which build RESULTS are observed by the
                # duration/count metrics (Runs.includeBuildInMetrics) — they
                # must be true for duration metrics to populate at all.
                countSuccessfulBuilds: true
                countUnstableBuilds: true
                countFailedBuilds: true
                countNotBuiltBuilds: true
                countAbortedBuilds: true
                fetchTestResults: true
                # Per-run metrics: adds the `number` (build number) label to the
                # plain build_*/stage_* families — this is what provides
                # per-run stage timings (DTSPO-34168) and per-run total runtime
                # (DTSPO-34169). Bounded to the last 10 builds per job AND max
                # 72h old (the stricter limit wins) to keep cardinality sane.
                perBuildMetrics: true
                perBuildMetricsMaxBuilds: 10
                perBuildMetricsMaxAgeInHours: 72
                appendParamLabel: false
                appendStatusLabel: false
                processingDisabledBuilds: false
